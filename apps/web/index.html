<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover so the fixed punch action can sit above the home
         indicator on a phone rather than under it. -->
    <!-- maximum-scale/user-scalable pin the zoom: asked for so a two-finger
         gesture on the punch screen cannot leave the camera frame
         half off-screen. Note two things. It fails WCAG 1.4.4, which
         NFR-07 commits to, so text sizing now depends entirely on the
         type scale being right. And iOS Safari has ignored
         user-scalable=no since iOS 10 -- this binds Android Chrome and
         desktop only. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Two values, because the address bar has to be legible in both themes.
         A single theme-colour paints a dark bar behind dark text in light
         mode, which is how this normally ships wrong. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)" />
    <!-- Both spellings: Chrome logs a deprecation warning for the apple- one
         alone and reads the standard name; iOS still reads only the apple-
         prefixed pair. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vyuha" />
    <meta
      name="description"
      content="Punch in and out with a live photo, see your attendance, and apply for leave."
    />
    <title>Vyuha</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Its own entry so registration is not tangled into the React tree; the
         production build merges it into the same chunk, which is fine, because
         after the first registration the browser re-fetches /sw.js on its own
         on every navigation. Replacing a worker does not depend on this file
         or on the bundle running again. -->
    <script type="module" src="/src/lib/offline/register-service-worker.ts"></script>
  </body>
</html>
