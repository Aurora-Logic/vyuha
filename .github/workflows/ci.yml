name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Public upstream tag hashes verified on 5 September 2026. Updates require review.
jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      # The same stack the developer runs, on the same ports .env.example
      # names, rather than a second description of it in this file.
      - name: Start Postgres, Redis and MinIO
        run: docker compose -f docker/docker-compose.yml up -d --wait

      # Where the API's test setup reads it: its own directory, before the
      # workspace-root dotenv has run.
      - name: Environment
        run: |
          cp .env.example apps/api/.env
          # The schema refuses the example's placeholder secrets on purpose.
          sed -i -E "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -base64 48)|" apps/api/.env
          sed -i -E "s|^JWT_REFRESH_SECRET=.*|JWT_REFRESH_SECRET=$(openssl rand -base64 48)|" apps/api/.env

      - name: Build shared
        run: pnpm --filter @vyuha/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-systemd.sh docker/backup.sh docker/restore.sh
          node --check scripts/verify-release.mjs
          node --test scripts/verify-release.test.mjs

      - name: Migrate the test database
        run: pnpm --filter @vyuha/api db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        env:
          VITE_API_BASE_URL: https://ci.invalid
          NODE_ENV: production
        run: pnpm build

  deploy:
    name: Deploy to server
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy the checked revision with verified SSH host identity
        env:
          SSH_HOST: ${{ secrets.SSH_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SOURCE_DIR: ${{ secrets.SSH_DIR }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
          CURRENT_LINK: ${{ secrets.CURRENT_RELEASE_LINK }}
          HEALTH_ORIGIN: ${{ secrets.HEALTH_ORIGIN }}
          BACKUP_SCRIPT: ${{ secrets.BACKUP_SCRIPT }}
          WEB_API: ${{ secrets.VITE_API_BASE_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${SSH_KNOWN_HOSTS:?Configure independently verified host keys}"
          : "${CURRENT_LINK:?Prepare the release symlink first}"
          task_ssh_dir=$(mktemp -d)
          trap 'rm -f "$task_ssh_dir/key" "$task_ssh_dir/known_hosts"; rmdir "$task_ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$task_ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$task_ssh_dir/known_hosts"
          printf -v remote 'bash -l -s -- %q %q %q %q %q %q %q' "$SOURCE_DIR" "$DEPLOY_SHA" "$SERVICE_NAME" "$CURRENT_LINK" "$HEALTH_ORIGIN" "$BACKUP_SCRIPT" "$WEB_API"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_ssh_dir/known_hosts" -i "$task_ssh_dir/key" -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "$remote" < scripts/deploy-systemd.sh
