name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Remote Server
    runs-on: self-hosted

    steps:
      - name: Execute Deployment Commands via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_IP }} << 'EOF'
            set -e
            cd ${{ secrets.SSH_DIR }}
            git pull origin main
            pnpm install
            cd apps/api
            pnpm db:migrate
            cd ${{ secrets.SSH_DIR }}
            pnpm build
            sudo systemctl restart ${{ secrets.SERVICE_NAME }}
          EOF
