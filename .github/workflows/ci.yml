name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:/usr/local/bin:/usr/bin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$PATH"
            [ -s "$HOME/.nvm/nvm.sh" ] && source "$HOME/.nvm/nvm.sh"
            [ -s "$HOME/.bashrc" ] && source "$HOME/.bashrc"

            echo "## 1. Navigating to project directory"
            cd "${{ secrets.SSH_DIR }}" || exit 1

            echo "## 2. Pulling latest changes"
            git pull origin main || exit 1

            echo "## 3. Installing dependencies"
            pnpm install || exit 1

            echo "## 4. Running database migrations"
            cd apps/api || exit 1
            pnpm db:migrate || exit 1
            cd "${{ secrets.SSH_DIR }}" || exit 1

            echo "## 5. Building applications"
            VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" NODE_ENV=production pnpm build || exit 1

            echo "## 6. Restarting service"
            sudo systemctl restart "${{ secrets.SERVICE_NAME }}" || exit 1

            echo "Deployed Successfully!"
